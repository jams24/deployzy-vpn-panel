<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.PanelName}} — Sign in</title>
{{template "styles" .}}
<style> body{display:grid;place-items:center} .lo{width:100%;max-width:380px;padding:24px} </style>
</head>
<body>
  <div class="lo">
    <div style="text-align:center;margin-bottom:20px">
      <div class="brand" style="justify-content:center;font-size:20px"><span class="dot"></span>{{.PanelName}}</div>
      <p class="sub" style="margin-top:6px">Admin control panel</p>
    </div>
    <form class="card" method="post" action="/login">
      {{if .Error}}<div class="alert err">{{.Error}}</div>{{end}}
      <label>Username</label>
      <input name="username" autocomplete="username" autofocus>
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password">
      <button class="btn block" type="submit" style="margin-top:20px">Sign in</button>
    </form>
  </div>
</body>
</html>
