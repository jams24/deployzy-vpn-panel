<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.PanelName}} — Sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#0b0e14; color:#e6e8eb; }
  .card { width:100%; max-width:360px; padding:32px; border:1px solid #1e2530; border-radius:16px; background:#11151d; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#8a93a2; font-size:13px; margin:0 0 24px; }
  label { display:block; font-size:12px; color:#8a93a2; margin:14px 0 6px; }
  input { width:100%; height:40px; padding:0 12px; border:1px solid #2a3340; border-radius:10px; background:#0b0e14; color:#e6e8eb; font-size:14px; outline:none; }
  input:focus { border-color:#3b82f6; }
  button { width:100%; height:42px; margin-top:22px; border:0; border-radius:10px; background:#3b82f6; color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#2f6fd6; }
  .err { margin-top:16px; padding:10px 12px; border:1px solid #7f1d1d; background:#2a1315; color:#fca5a5; border-radius:10px; font-size:13px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>{{.PanelName}}</h1>
    <p class="sub">Admin sign in</p>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label>Username</label>
    <input name="username" autocomplete="username" autofocus>
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
