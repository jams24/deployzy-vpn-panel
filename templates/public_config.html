<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.PanelName}} — Public page</title>
{{template "styles" .}}
</head>
<body>
  {{template "topnav" .}}
  <div class="wrap wrap-sm">
    <h1 class="pt">Public free page</h1>
    <p class="sub">Open a public homepage where anyone can create a free SSH / V2Ray account on the server and terms you choose.</p>
    <div class="card">
      <form method="post" action="/admin/public">
        <label style="display:flex;align-items:center;gap:10px;margin-top:0;cursor:pointer">
          <input type="checkbox" name="enabled" {{if .Cfg.Enabled}}checked{{end}} style="width:auto">
          <span>Enable the public page at your panel's homepage</span>
        </label>
        <label>Server for free accounts</label>
        <select name="server_id">
          <option value="0">— select a server —</option>
          {{range .Servers}}
          <option value="{{.ID}}" {{if eq .ID $.Cfg.ServerID}}selected{{end}}>{{.Label}} ({{if .IP}}{{.IP}}{{else}}{{.Host}}{{end}})</option>
          {{end}}
        </select>
        <div class="grid g3">
          <div><label>Days per account</label><input name="days" value="{{.Cfg.Days}}"></div>
          <div><label>Max logins</label><input name="max_logins" value="{{.Cfg.MaxLogins}}"></div>
          <div><label>Per-IP / day</label><input name="per_ip_daily" value="{{.Cfg.PerIPDaily}}"></div>
        </div>
        <p class="muted fs12" style="margin-top:10px">Only servers you've installed appear above. Free accounts are created on that server.</p>
        <button class="btn" type="submit" style="margin-top:6px">Save</button>
      </form>
    </div>
  </div>
</body>
</html>
